name: Skill Judge
on: [push, pull_request]
jobs:
  judge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Spec check
        run: python skills/deep-research/scripts/spec_check.py skills/quran-hadith-verifier/
      - name: Judge all stages
        run: |
          for s in 1 2 3 4 5 6; do
            python skills/deep-research/scripts/judge_score.py --stage $s --scores-file evals/scores-stage$s.json
          done
      - name: Run evals
        run: python skills/quran-hadith-verifier/scripts/run_evals.py
